<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALBERTO-VIP-WATCHES — Contact Form</title>
    <link rel="stylesheet" href="contstyle.css" />
  </head>
  <body>
    <div class="page">
      <div class="heading">
        <div class="title">ALBERTO-VIP-WATCHES</div>
        <div class="subtitle">CONTACT US</div>
      </div>

      <div class="card">
        <div class="info-panel">
          <div class="headline">
            <div>SHINE</div>
            <div>WITH</div>
            <div>ALBERTO-VIP-WATCHES</div>
          </div>

          <div class="contact-list">
            <div class="contact-item">
              <div class="icon-box">@</div>
              <div>albertovipwatches@gmail.com</div>
            </div>
            <div class="contact-item">
              <div class="icon-box">☎</div>
              <div>0321 1234567</div>
            </div>
            <div class="contact-item">
              <div class="icon-box">📍</div>
              <div>Aptech Sharah e Faisal</div>
            </div>
          </div>
        </div>

        <div class="form-panel">
          <div class="input-group">
            <label>Your name</label>
            <div class="input-line">
              <input type="text" placeholder="Your Name" />
            </div>
          </div>

          <div class="input-group">
            <label>Your email</label>
            <div class="input-line muted">
              <input type="email" placeholder="email@gmail.com" />
            </div>
          </div>

          <div class="input-group">
            <label>Your message</label>
            <div class="textarea-box">
              <textarea placeholder="Type your message here..."></textarea>
            </div>
          </div>

          <div class="send-btn">Send message</div>
        </div>
      </div>
    </div>
  </body>
</html>
